name: Keep backend warm

# Render's free tier sleeps after ~15 min idle and the next visitor waits
# through a cold start (measured 51.7 s, docs/PERF_BASELINE.md).
#
# Limits, measured on this repo:
# * GitHub delays scheduled runs under load. "*/10" actually fired every
#   4-8 hours here, so this is best effort and cannot by itself keep the
#   instance awake. An external free pinger (UptimeRobot, cron-job.org) at
#   5-10 min is the reliable option.
# * GitHub pauses scheduled workflows after 60 days without repo activity.
# * Render's free plan has 750 instance-hours/month per workspace. One
#   always-awake service uses ~730, so a second free service would run out.
#
# Pings /health, which never touches the database, so Neon can still scale
# to zero (its free plan has a monthly compute-hour cap).
# Override the target with the BACKEND_URL repository variable.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      BACKEND_URL: ${{ vars.BACKEND_URL || 'https://agentflow-backend-uosi.onrender.com' }}
    steps:
      - name: Ping health endpoint
        run: |
          curl --fail --silent --show-error --max-time 120 \
            --retry 2 --retry-delay 10 \
            -w "\nstatus=%{http_code} ttfb=%{time_starttransfer}s\n" \
            "$BACKEND_URL/health"
